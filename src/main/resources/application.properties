spring.application.name=trade-service
kafka.bootstrap-servers=localhost:9092
management.tracing.enabled=true
logging.pattern.level=[${spring.application.name:},%X{traceId:-},%X{spanId:-}] %5p %m%n
trade.events.topic=trade-events
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:tradedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
server.port=8081
app.kafka.outbox-polling-interval=5000
